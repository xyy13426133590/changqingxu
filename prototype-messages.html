<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>长情许 - 消息</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="prototype-cqx-shared.css">
</head>
<body class="bg-gray-100" data-cqx="messages">
    <div class="max-w-md mx-auto min-h-screen gradient-bg relative flex flex-col">
        <div class="fixed inset-0 pointer-events-none max-w-md mx-auto">
            <div class="absolute -top-20 -right-20 w-60 h-60 bg-purple-300/30 rounded-full blur-3xl"></div>
            <div class="absolute top-1/3 -left-10 w-40 h-40 bg-blue-300/30 rounded-full blur-3xl"></div>
        </div>

        <div class="flex-1 min-h-0 flex flex-col relative z-10">
            <div id="page-messages" class="page active flex-1 min-h-0 flex flex-col">
                <div class="flex items-center px-6 py-4 shrink-0">
                    <a href="prototype-discover.html" class="w-10 h-10 glass rounded-full flex items-center justify-center btn-press">
                        <i class="fas fa-arrow-left text-gray-600"></i>
                    </a>
                    <span class="flex-1 text-center font-semibold text-gray-800 mr-10">消息</span>
                </div>
                <div class="flex-1 min-h-0 px-4 pb-4 overflow-y-auto no-scrollbar space-y-2" id="messages-thread-list"></div>
            </div>

            <div id="page-chat" class="page flex-1 min-h-0 flex flex-col bg-gradient-to-b from-violet-100/80 to-sky-100/80">
                <div class="flex items-center gap-3 px-4 py-3 shrink-0 glass border-b border-white/40">
                    <button type="button" onclick="showPage('page-messages')" class="w-10 h-10 rounded-full bg-white/50 flex items-center justify-center btn-press">
                        <i class="fas fa-arrow-left text-gray-700"></i>
                    </button>
                    <img id="chat-peer-avatar" src="" alt="" class="w-10 h-10 rounded-full object-cover ring-2 ring-white/80 anim-avatar">
                    <div class="flex-1 min-w-0">
                        <div id="chat-peer-name" class="font-semibold text-gray-800 truncate">好友</div>
                        <div class="text-xs text-gray-500">站内信 · 请勿轻信站外转账</div>
                    </div>
                </div>
                <div id="chat-risk-banner" class="hidden mx-3 mt-2 rounded-xl bg-amber-100 border border-amber-300 text-amber-900 text-xs px-3 py-2 flex gap-2 items-start risk-pulse shrink-0">
                    <i class="fas fa-triangle-exclamation mt-0.5 shrink-0"></i>
                    <div class="flex-1"><strong>安全提示：</strong><span id="chat-risk-text"></span> 请勿随意添加陌生联系方式或跳转第三方平台，谨防诈骗。</div>
                    <button type="button" onclick="dismissChatRisk()" class="text-amber-800 px-1 shrink-0"><i class="fas fa-times"></i></button>
                </div>
                <div id="chat-messages-scroll" class="flex-1 min-h-0 overflow-y-auto no-scrollbar px-3 py-4 space-y-3"></div>
                <div class="shrink-0 p-3 glass border-t border-white/40 rounded-t-2xl">
                    <div class="flex items-end gap-2">
                        <textarea id="chat-input" rows="1" placeholder="文明发言，涉及站外引导将提示风险…" class="flex-1 max-h-28 min-h-[44px] rounded-2xl bg-white/70 px-4 py-3 text-sm text-gray-800 outline-none resize-none border border-purple-100 focus:border-purple-300"></textarea>
                        <button type="button" onclick="sendChatMessage()" class="w-11 h-11 shrink-0 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 text-white flex items-center justify-center shadow-lg btn-press anim-avatar">
                            <i class="fas fa-paper-plane text-sm"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <nav id="app-tabbar" class="shrink-0 glass px-6 py-4 flex items-center justify-between rounded-t-3xl z-20">
            <a href="prototype-discover.html" class="flex flex-col items-center gap-1 text-gray-400 btn-press">
                <i class="fas fa-compass text-xl"></i><span class="text-xs">发现</span>
            </a>
            <a href="prototype-filter.html" class="flex flex-col items-center gap-1 text-gray-400 btn-press">
                <i class="fas fa-filter text-xl"></i><span class="text-xs">筛选</span>
            </a>
            <span class="flex flex-col items-center gap-1 text-purple-600">
                <i class="fas fa-comment-dots text-xl"></i><span class="text-xs">消息</span>
            </span>
            <a href="prototype-mine.html" class="flex flex-col items-center gap-1 text-gray-400 btn-press">
                <i class="fas fa-user text-xl"></i><span class="text-xs">我的</span>
            </a>
        </nav>
    </div>
    <script src="prototype-cqx-shared.js"></script>
</body>
</html>
