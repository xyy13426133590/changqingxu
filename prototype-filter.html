<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>长情许 - 筛选</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="prototype-cqx-shared.css">
</head>
<body class="bg-gray-100" data-cqx="filter">
    <div class="max-w-md mx-auto min-h-screen gradient-bg relative flex flex-col">
        <div class="fixed inset-0 pointer-events-none max-w-md mx-auto">
            <div class="absolute -top-20 -right-20 w-60 h-60 bg-purple-300/30 rounded-full blur-3xl"></div>
            <div class="absolute top-1/3 -left-10 w-40 h-40 bg-blue-300/30 rounded-full blur-3xl"></div>
        </div>

        <div class="flex-1 min-h-0 flex flex-col relative z-10">
            <div class="flex items-center px-6 py-4 shrink-0">
                <a href="prototype-discover.html" class="w-10 h-10 glass rounded-full flex items-center justify-center btn-press">
                    <i class="fas fa-arrow-left text-gray-600"></i>
                </a>
                <span class="flex-1 text-center font-semibold text-gray-800 mr-10">筛选条件</span>
            </div>

            <div class="flex-1 min-h-0 px-6 overflow-y-auto no-scrollbar pb-28">
                <div class="glass rounded-2xl p-4 mb-4">
                    <h3 class="font-semibold text-gray-800 mb-3 flex items-center gap-2">
                        <i class="fas fa-star text-yellow-500"></i>
                        趣味配对（民俗参考）
                    </h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" class="p-3 bg-purple-500 text-white rounded-xl text-center">
                            <div class="font-medium">不限</div>
                        </button>
                        <button type="button" class="p-3 bg-white/50 text-gray-700 rounded-xl text-center">
                            <div class="font-medium">三合 ✨</div>
                            <div class="text-xs text-gray-500">猴鼠龙 / 蛇鸡牛 / 虎马狗 / 猪兔羊</div>
                        </button>
                        <button type="button" class="p-3 bg-white/50 text-gray-700 rounded-xl text-center">
                            <div class="font-medium">六合 🌟</div>
                            <div class="text-xs text-gray-500">鼠牛 / 虎猪 / 兔狗 / 龙鸡 / 蛇猴 / 马羊</div>
                        </button>
                        <button type="button" class="p-3 bg-white/50 text-gray-700 rounded-xl text-center">
                            <div class="font-medium">两者皆匹配</div>
                        </button>
                    </div>
                    <p class="text-xs text-gray-500 mt-3 bg-white/30 rounded-lg p-2">
                        <i class="fas fa-info-circle mr-1"></i>
                        生肖三合六合仅为传统民俗文化参考，仅供娱乐交友使用
                    </p>
                </div>

                <div class="glass rounded-2xl p-4 mb-4">
                    <h3 class="font-semibold text-gray-800 mb-3">年龄范围</h3>
                    <div class="px-2">
                        <input type="range" min="18" max="60" value="26" class="w-full h-2 bg-purple-200 rounded-lg appearance-none cursor-pointer">
                        <div class="flex justify-between text-sm text-gray-600 mt-2">
                            <span>18岁</span>
                            <span class="font-semibold text-purple-600">26岁</span>
                            <span>60岁</span>
                        </div>
                    </div>
                </div>

                <div class="glass rounded-2xl p-4 mb-4">
                    <h3 class="font-semibold text-gray-800 mb-3">距离</h3>
                    <div class="flex gap-2">
                        <button type="button" class="flex-1 py-2 bg-purple-500 text-white rounded-xl text-sm">同城</button>
                        <button type="button" class="flex-1 py-2 bg-white/50 text-gray-700 rounded-xl text-sm">同省</button>
                        <button type="button" class="flex-1 py-2 bg-white/50 text-gray-700 rounded-xl text-sm">不限</button>
                    </div>
                </div>

                <div class="glass rounded-2xl p-4 mb-4">
                    <h3 class="font-semibold text-gray-800 mb-3">学历</h3>
                    <div class="flex flex-wrap gap-2">
                        <span class="px-3 py-1.5 bg-white/50 text-gray-700 rounded-full text-sm">大专及以下</span>
                        <span class="px-3 py-1.5 bg-purple-500 text-white rounded-full text-sm">本科</span>
                        <span class="px-3 py-1.5 bg-white/50 text-gray-700 rounded-full text-sm">硕士及以上</span>
                    </div>
                </div>

                <div class="glass rounded-2xl p-4 mb-6">
                    <h3 class="font-semibold text-gray-800 mb-3">年收入</h3>
                    <div class="flex flex-wrap gap-2">
                        <span class="px-3 py-1.5 bg-white/50 text-gray-700 rounded-full text-sm">5万及以下</span>
                        <span class="px-3 py-1.5 bg-white/50 text-gray-700 rounded-full text-sm">5万-10万</span>
                        <span class="px-3 py-1.5 bg-white/50 text-gray-700 rounded-full text-sm">10万-20万</span>
                        <span class="px-3 py-1.5 bg-purple-500 text-white rounded-full text-sm">20万-30万</span>
                        <span class="px-3 py-1.5 bg-white/50 text-gray-700 rounded-full text-sm">30万-50万</span>
                        <span class="px-3 py-1.5 bg-white/50 text-gray-700 rounded-full text-sm">50万以上</span>
                    </div>
                </div>

                <a href="prototype-discover.html" class="block w-full text-center bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold py-4 rounded-2xl shadow-lg mb-6 btn-press">
                    应用筛选
                </a>
            </div>
        </div>

        <nav id="app-tabbar" class="absolute bottom-0 left-0 right-0 glass px-6 py-4 flex items-center justify-between rounded-t-3xl z-20 max-w-md mx-auto">
            <a href="prototype-discover.html" class="flex flex-col items-center gap-1 text-gray-400 btn-press">
                <i class="fas fa-compass text-xl"></i><span class="text-xs">发现</span>
            </a>
            <span class="flex flex-col items-center gap-1 text-purple-600">
                <i class="fas fa-filter text-xl"></i><span class="text-xs">筛选</span>
            </span>
            <a href="prototype-messages.html" class="flex flex-col items-center gap-1 text-gray-400 btn-press">
                <i class="fas fa-comment-dots text-xl"></i><span class="text-xs">消息</span>
            </a>
            <a href="prototype-mine.html" class="flex flex-col items-center gap-1 text-gray-400 btn-press">
                <i class="fas fa-user text-xl"></i><span class="text-xs">我的</span>
            </a>
        </nav>
    </div>
    <script src="prototype-cqx-shared.js"></script>
</body>
</html>
